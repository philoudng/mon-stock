name: Prix Cardmarket

on:
  schedule:
    - cron: '17 4 * * *'   # tous les jours vers 6 h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_cardmarket.py'
      - '.github/workflows/cardmarket.yml'
      - 'data/pokemon.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le catalogue et les prix Cardmarket
        run: python3 scripts/update_cardmarket.py
      - name: Enregistrer
        run: |
          git config user.name "mon-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cardmarket.json data/cardmarket-sample.json
          git diff --cached --quiet || (git commit -m "Prix Cardmarket du $(date +%F)" && git push)
